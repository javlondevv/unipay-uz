name: docker

# Builds the demo image (Dockerfile + examples/demo_app.py) and publishes it to
# ghcr.io/<owner>/<repo>. A version tag (v1.2.3) builds that version; a manual
# run builds the latest v* tag, or the default branch at the pyproject version
# if the repo has no version tags yet.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Put the OCI annotations on the multi-arch index too, so GHCR shows the description.
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$latest_tag"
          fi

          if [ -n "$tag" ]; then
            git checkout --quiet "refs/tags/$tag"
            version="${tag#v}"
          else
            echo "No version tags found; building $(git rev-parse --abbrev-ref HEAD) at the pyproject version."
            version=""
          fi

          pyproject_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          version="${version:-$pyproject_version}"
          if [ "$version" != "$pyproject_version" ]; then
            echo "::warning::Tag version $version differs from pyproject.toml version $pyproject_version"
          fi

          # Only the newest stable release moves :latest.
          if [ -z "$tag" ] || [ "$tag" = "$latest_tag" ]; then is_latest=true; else is_latest=false; fi

          {
            echo "version=$version"
            echo "is_latest=$is_latest"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE version $version (latest=$is_latest) from $(git rev-parse --short HEAD)"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=unipay-uz
            org.opencontainers.image.description=unipay-uz demo: offline checkout links for Payme, Click, Uzum and Paynet, plus the FastAPI webhook handlers
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
          annotations: |
            org.opencontainers.image.description=unipay-uz demo: offline checkout links for Payme, Click, Uzum and Paynet, plus the FastAPI webhook handlers
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
